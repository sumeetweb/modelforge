global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts/*.yml]
scrape_configs:
  - job_name: gateway
    dns_sd_configs:
      - names: [gateway.modelforge.local]
        type: A
        port: 8080
        refresh_interval: 15s
  - job_name: models
    dns_sd_configs:
      - names: [stable.modelforge.local, candidate.modelforge.local]
        type: A
        port: 8000
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        regex: '(stable|candidate)\.modelforge\.local'
        target_label: target
        replacement: '$1'
