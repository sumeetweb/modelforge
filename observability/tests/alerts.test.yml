rule_files:
  - ../alerts/inference.yml
evaluation_interval: 5s
tests:
  - interval: 5s
    input_series:
      - series: 'up{job="models",target="candidate"}'
        values: '0+0x12'
      - series: 'model_load_failures_total{job="models",target="stable"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 40s
        alertname: ModelForgeTargetDown
        exp_alerts:
          - exp_labels: {job: models, target: candidate, severity: critical}
            exp_annotations:
              summary: A service cannot be scraped
              runbook: docs/incident-runbooks.md#unavailable
      - eval_time: 40s
        alertname: ModelForgeModelLoadFailed
        exp_alerts:
          - exp_labels: {job: models, target: stable, severity: critical}
            exp_annotations:
              summary: Artifact failed to load; model cannot serve
              runbook: docs/incident-runbooks.md#invalid-artifact
